{% load static %}<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}NexoPyme AI{% endblock %}</title>
    <meta name="description" content="{% block description %}NexoPyme AI, plataforma de gestión empresarial para pequeñas empresas.{% endblock %}">
    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
  </head>
  <body class="site">
    <a class="skip-link" href="#contenido">Saltar al contenido principal</a>

    {% block site_header %}{% include "components/navbar.html" %}{% endblock %}

    <main class="site-main" id="contenido" tabindex="-1">
      <div class="container">
        {% block content %}{% endblock %}
      </div>
    </main>

    {% include "components/footer.html" %}

    {% block scripts %}{% endblock %}
  </body>
</html>
